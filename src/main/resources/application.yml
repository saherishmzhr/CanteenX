server:
  port: ${PORT:8080}

spring:
  application:
    name: smart-canteen

  # =========================================================================
  # DEFAULT DATABASE: H2 File-Based (Zero Setup)
  # To switch to MySQL in one line, either:
  #   1) Set SPRING_PROFILES_ACTIVE=mysql (or --spring.profiles.active=mysql)
  #   2) Or uncomment the MySQL datasource block below and comment out H2.
  # =========================================================================
  datasource:
    url: jdbc:h2:file:./data/smartcanteen;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # --- Commented MySQL Block (uncomment and comment H2 above if not using mysql profile) ---
  # datasource:
  #   url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_canteen}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   username: ${MYSQL_USER:root}
  #   password: ${MYSQL_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

canteen:
  currency-symbol: "₹"
  app-name: "Smart Canteen"
