<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Canteen Menu', 'menu', ~{::menuBody})}">
<th:block th:fragment="menuBody">
    <div class="page-header">
        <div>
            <h1 class="page-title">Today's Canteen Menu</h1>
            <p class="page-subtitle">Freshly prepared items. Add to cart and pick up with your daily token.</p>
        </div>
        <a th:href="@{/student/cart}" class="btn btn-primary">
            View Cart (<span th:text="${cartCount}">0</span>) ·
            <span th:text="${currencySymbol} + ${#numbers.formatDecimal(cartTotal, 1, 2)}">₹0.00</span>
        </a>
    </div>

    <form th:action="@{/student/menu}" method="get" class="filter-bar">
        <div class="filter-pills">
            <a th:href="@{/student/menu(category='ALL', search=${searchQuery})}"
               th:classappend="${selectedCategory == 'ALL'} ? 'active'"
               class="pill-btn">ALL</a>
            <a th:href="@{/student/menu(category='VEG', search=${searchQuery})}"
               th:classappend="${selectedCategory == 'VEG'} ? 'active'"
               class="pill-btn">VEG</a>
            <a th:href="@{/student/menu(category='NON-VEG', search=${searchQuery})}"
               th:classappend="${selectedCategory == 'NON-VEG'} ? 'active'"
               class="pill-btn">NON-VEG</a>
        </div>

        <input type="hidden" name="category" th:value="${selectedCategory}"/>
        <input type="text" name="search" th:value="${searchQuery}"
               placeholder="Search dishes by name..." class="form-control input-inline"/>
        <button type="submit" class="btn btn-secondary btn-sm">Search</button>
        <a th:if="${(searchQuery != null and !searchQuery.isEmpty()) or selectedCategory != 'ALL'}"
           th:href="@{/student/menu}" class="btn btn-secondary btn-sm">Reset</a>
    </form>

    <div th:if="${#lists.isEmpty(menuItems)}" class="card">
        <p class="text-muted" style="margin:0;">No menu items match your current filter.</p>
    </div>

    <div class="menu-grid" th:if="${!#lists.isEmpty(menuItems)}">
        <div class="card menu-card" th:each="item : ${menuItems}">
            <div>
                <div class="menu-card-top">
                    <h2 class="menu-item-name" th:text="${item.item_name}">Dish Name</h2>
                    <span th:class="${item.category == 'VEG'} ? 'badge badge-veg' : 'badge badge-nonveg'"
                          th:text="${item.category}">VEG</span>
                </div>
                <div class="menu-price mt-1"
                     th:text="${currencySymbol} + ${#numbers.formatDecimal(item.price, 1, 2)}">₹0.00</div>
            </div>

            <div>
                <div class="menu-meta mb-1">
                    <span th:if="${item.stock > 0}" th:text="'In Stock: ' + ${item.stock}">In Stock</span>
                    <span th:if="${item.stock <= 0}" style="color:var(--danger); font-weight:600;">Sold Out</span>
                </div>

                <form th:action="@{/student/cart/add}" method="post" class="flex-gap">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="itemId" th:value="${item.item_id}"/>
                    <input type="hidden" name="redirectUrl" value="/student/menu"/>
                    <input type="number" name="quantity" value="1" min="1"
                           th:max="${item.stock > 0 ? item.stock : 1}"
                           th:disabled="${item.stock <= 0}"
                           class="qty-input" aria-label="Quantity"/>
                    <button type="submit" class="btn btn-primary btn-sm" style="flex:1;"
                            th:disabled="${item.stock <= 0}">
                        <span th:text="${item.stock > 0} ? 'Add to Cart' : 'Out of Stock'">Add to Cart</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</th:block>
</html>
