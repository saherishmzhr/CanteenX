<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Menu Management', 'admin-menu', ~{::adminMenuBody})}">
<th:block th:fragment="adminMenuBody">
    <div class="page-header">
        <div>
            <h1 class="page-title">Menu Catalog Management</h1>
            <p class="page-subtitle">Add, edit, toggle VEG/NON-VEG, update stock, or soft-delete menu items.</p>
        </div>
        <a th:if="${isEditing}" th:href="@{/admin/menu}" class="btn btn-secondary btn-sm">Cancel Edit</a>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title" th:text="${isEditing} ? 'Edit Menu Item #' + ${menuItemForm.item_id} : 'Add New Menu Item'">Add Menu Item</h2>
            </div>

            <form th:action="@{/admin/menu/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="item_id" th:value="${menuItemForm.item_id}"/>

                <div class="form-group">
                    <label for="item_name" class="form-label">Item Name</label>
                    <input type="text" id="item_name" name="item_name"
                           th:value="${menuItemForm.item_name}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" name="category" class="form-select">
                        <option value="VEG" th:selected="${menuItemForm.category == 'VEG'}">VEG</option>
                        <option value="NON-VEG" th:selected="${menuItemForm.category == 'NON-VEG'}">NON-VEG</option>
                    </select>
                </div>

                <div class="grid-2" style="gap:0.75rem;">
                    <div class="form-group">
                        <label for="price" class="form-label">Price (<span th:text="${currencySymbol}">₹</span>)</label>
                        <input type="number" step="0.50" min="0.50" id="price" name="price"
                               th:value="${menuItemForm.price}" class="form-control" required/>
                    </div>

                    <div class="form-group">
                        <label for="stock" class="form-label">Stock Quantity</label>
                        <input type="number" min="0" id="stock" name="stock"
                               th:value="${menuItemForm.stock}" class="form-control" required/>
                    </div>
                </div>

                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                        <input type="checkbox" name="active" value="true"
                               th:checked="${menuItemForm.active == null || menuItemForm.active}"/>
                        <span>Active (visible to students)</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;"
                        th:text="${isEditing} ? 'Update Menu Item' : 'Create Menu Item'">Save Item</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">All Menu Items</h2>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th class="text-right">Price</th>
                        <th class="text-right">Stock</th>
                        <th>Status</th>
                        <th class="text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${menuItems}">
                        <td>
                            <strong th:text="${item.item_name}">Dish</strong>
                        </td>
                        <td>
                            <span th:class="${item.category == 'VEG'} ? 'badge badge-veg' : 'badge badge-nonveg'"
                                  th:text="${item.category}">VEG</span>
                        </td>
                        <td class="text-right"
                            th:text="${currencySymbol} + ${#numbers.formatDecimal(item.price, 1, 2)}">₹0.00</td>
                        <td class="text-right" th:text="${item.stock}">0</td>
                        <td>
                            <span th:if="${item.active}" class="badge badge-paid">ACTIVE</span>
                            <span th:unless="${item.active}" class="badge badge-status">INACTIVE</span>
                        </td>
                        <td class="text-right">
                            <div class="flex-gap" style="justify-content:flex-end;">
                                <a th:href="@{/admin/menu(editId=${item.item_id})}"
                                   class="btn btn-secondary btn-sm">Edit</a>

                                <form th:action="@{/admin/menu/{id}/toggle-category(id=${item.item_id})}"
                                      method="post" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-secondary btn-sm" title="Toggle VEG / NON-VEG">Flip</button>
                                </form>

                                <form th:if="${item.active}"
                                      th:action="@{/admin/menu/{id}/delete(id=${item.item_id})}"
                                      method="post" style="display:inline;"
                                      data-confirm="Soft-delete this item so students cannot order it?">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-danger btn-sm">Disable</button>
                                </form>

                                <form th:unless="${item.active}"
                                      th:action="@{/admin/menu/{id}/restore(id=${item.item_id})}"
                                      method="post" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-success btn-sm">Enable</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</html>
