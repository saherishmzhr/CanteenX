<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Access Denied', 'denied', ~{::deniedBody})}">
<th:block th:fragment="deniedBody">
    <div class="card" style="max-width:560px; margin:2rem auto; text-align:center;">
        <h1 class="page-title" style="color:var(--danger);">403 — Access Denied</h1>
        <p class="page-subtitle mt-1">Your account role does not have permission to view this page.</p>
        <div class="mt-2">
            <a th:href="@{/}" class="btn btn-primary">Go to My Home</a>
        </div>
    </div>
</th:block>
</html>
