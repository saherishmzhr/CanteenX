<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Sign In', 'login', ~{::loginBody})}">
<th:block th:fragment="loginBody">
    <div class="auth-wrapper">
        <div class="card">
            <h1 class="page-title" style="font-size:1.45rem;">Sign In</h1>
            <p class="page-subtitle">Enter your canteen credentials to continue.</p>

            <form th:action="@{/login}" method="post" class="mt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus/>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required/>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
            </form>

            <p class="mt-2 text-muted" style="font-size:0.88rem; text-align:center;">
                New student? <a th:href="@{/register}">Create a student account</a>
            </p>

            <div class="demo-box">
                <strong>Demo Accounts (Click to Fill):</strong>
                <div class="demo-row">
                    <span><strong>ADMIN:</strong> <code>admin</code> / <code>admin123</code></span>
                    <button type="button" class="btn btn-secondary btn-sm fill-demo-btn"
                            data-username="admin" data-password="admin123">Fill</button>
                </div>
                <div class="demo-row">
                    <span><strong>STAFF:</strong> <code>staff</code> / <code>staff123</code></span>
                    <button type="button" class="btn btn-secondary btn-sm fill-demo-btn"
                            data-username="staff" data-password="staff123">Fill</button>
                </div>
                <div class="demo-row">
                    <span><strong>STUDENT:</strong> <code>student</code> / <code>student123</code></span>
                    <button type="button" class="btn btn-secondary btn-sm fill-demo-btn"
                            data-username="student" data-password="student123">Fill</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
</html>
