<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Kitchen Orders', 'staff-orders', ~{::staffBody})}">
<th:block th:fragment="staffBody">
    <div class="page-header">
        <div>
            <h1 class="page-title">Kitchen &amp; Counter Orders</h1>
            <p class="page-subtitle">Advance order preparation stages and confirm cash payments.</p>
        </div>
        <a th:href="@{/staff/orders(scope=${selectedScope}, status=${selectedStatus})}"
           class="btn btn-secondary btn-sm">Refresh</a>
    </div>

    <form th:action="@{/staff/orders}" method="get" class="filter-bar">
        <div class="filter-pills">
            <a th:href="@{/staff/orders(scope='TODAY', status=${selectedStatus})}"
               th:classappend="${selectedScope == 'TODAY'} ? 'active'"
               class="pill-btn">Today's Orders</a>
            <a th:href="@{/staff/orders(scope='ALL', status=${selectedStatus})}"
               th:classappend="${selectedScope == 'ALL'} ? 'active'"
               class="pill-btn">All Dates</a>
        </div>

        <label for="statusFilter" class="form-label" style="margin:0 0 0 0.5rem;">Status:</label>
        <select id="statusFilter" name="status" class="form-select input-inline" onchange="this.form.submit()">
            <option value="ALL" th:selected="${selectedStatus == 'ALL'}">All Statuses</option>
            <option th:each="st : ${allStatuses}"
                    th:value="${st.name()}"
                    th:text="${st.name()}"
                    th:selected="${selectedStatus == st.name()}">STATUS</option>
        </select>
        <input type="hidden" name="scope" th:value="${selectedScope}"/>
    </form>

    <div th:if="${#lists.isEmpty(orders)}" class="card">
        <p class="text-muted" style="margin:0;">No orders found for the selected filter.</p>
    </div>

    <div class="card" th:if="${!#lists.isEmpty(orders)}">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Token</th>
                    <th>Order</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Update Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td><strong style="font-size:1.1rem; color:var(--primary);" th:text="'#' + ${o.token_no}">#1</strong></td>
                    <td>
                        <div th:text="'#' + ${o.order_id}">#1</div>
                        <div class="text-muted" style="font-size:0.78rem;"
                             th:text="${#temporals.format(o.order_time, 'hh:mm a')}">Time</div>
                    </td>
                    <td th:text="${o.customer != null ? o.customer.full_name : 'User #' + o.user_id}">Student</td>
                    <td>
                        <div th:each="d : ${o.details}" style="font-size:0.85rem;"
                             th:text="${d.quantity} + 'x ' + ${d.item_name}">1x Dosa</div>
                    </td>
                    <td><strong th:text="${currencySymbol} + ${#numbers.formatDecimal(o.total, 1, 2)}">₹0.00</strong></td>
                    <td>
                        <div><strong th:text="${o.payment_method}">CASH</strong></div>
                        <span class="badge"
                              th:classappend="${o.payment_status == 'PAID'} ? 'badge-paid' : 'badge-pending'"
                              th:text="${o.payment_status}">PAID</span>
                        <form th:if="${o.payment_method == 'CASH' and o.payment_status != 'PAID'}"
                              th:action="@{/staff/orders/{id}/pay(id=${o.order_id})}"
                              method="post" style="margin-top:0.35rem;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="scope" th:value="${selectedScope}"/>
                            <input type="hidden" name="statusFilter" th:value="${selectedStatus}"/>
                            <button type="submit" class="btn btn-success btn-sm">Mark PAID</button>
                        </form>
                    </td>
                    <td>
                        <span class="badge badge-status"
                              th:classappend="'status-' + ${o.status}"
                              th:text="${o.status}">PLACED</span>
                    </td>
                    <td>
                        <form th:action="@{/staff/orders/{id}/status(id=${o.order_id})}"
                              method="post" class="flex-gap"
                              th:attr="data-confirm=${'Change order #' + o.order_id + ' status?' }">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="scope" th:value="${selectedScope}"/>
                            <input type="hidden" name="statusFilter" th:value="${selectedStatus}"/>
                            <select name="status" class="form-select" style="width:auto; padding:0.32rem 0.5rem; font-size:0.84rem;">
                                <option th:each="st : ${allStatuses}"
                                        th:value="${st.name()}"
                                        th:text="${st.name()}"
                                        th:selected="${o.status == st.name()}">PLACED</option>
                            </select>
                            <button type="submit" class="btn btn-primary btn-sm">Save</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</html>
